name: Windows desktop

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: desktop-requirements.txt
      - name: Build Windows distribution
        shell: pwsh
        run: .\build-desktop.ps1 -Python python
      - name: Install browser test dependencies
        shell: pwsh
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Test offline dashboard and existing browser flow
        shell: pwsh
        run: python -m unittest discover -s tests -p desktop_test.py -v
      - name: Check packaged executable, assets, and data isolation
        shell: pwsh
        run: .\tests\check-desktop-package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Agnostos-Windows
          path: dist\Agnostos\
          if-no-files-found: error
          retention-days: 14
