name: Database and API

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r server/requirements.txt
      - run: python tests/database_test.py
      - run: node --check web/app.js && node --check web/researchers.js

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agnostos
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: agnostos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agnostos -d agnostos_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      AGNOSTOS_TEST_DATABASE_URL: postgresql+psycopg://agnostos:test-only-password@localhost:5432/agnostos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r server/requirements.txt
      - run: python tests/database_test.py
